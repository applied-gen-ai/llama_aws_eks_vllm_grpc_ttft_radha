{{- if .Values.addons.dcgmExporter.enabled }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dcgm-exporter
  labels:
    app: dcgm-exporter
spec:
  selector:
    matchLabels:
      app: dcgm-exporter
  template:
    metadata:
      labels:
        app: dcgm-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.addons.dcgmExporter.port }}"
    spec:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: dcgm-exporter
          image: "{{ .Values.addons.dcgmExporter.image.repository }}:{{ .Values.addons.dcgmExporter.image.tag }}"
          ports:
            - name: metrics
              containerPort: {{ .Values.addons.dcgmExporter.port }}
          volumeMounts:
            - name: pod-gpu-resources
              mountPath: /var/lib/kubelet/pod-resources
              readOnly: true
      volumes:
        - name: pod-gpu-resources
          hostPath:
            path: /var/lib/kubelet/pod-resources

---
apiVersion: v1
kind: Service
metadata:
  name: dcgm-exporter
  labels:
    app: dcgm-exporter
spec:
  selector:
    app: dcgm-exporter
  ports:
    - name: metrics
      port: {{ .Values.addons.dcgmExporter.port }}
      targetPort: {{ .Values.addons.dcgmExporter.port }}
{{- end }}
